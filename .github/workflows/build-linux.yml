# Linux build on every source push to main and every pull request; a manual run also
# packages it (archive) as a downloadable artifact.
# Steps live in build-platform.yml; release.yml builds all platforms for v* tags.
name: Linux

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'patches/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'dependencies.lock.json'
      - '.github/workflows/build-platform.yml'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cmake/**'
      - 'patches/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'dependencies.lock.json'
      - '.github/workflows/build-platform.yml'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older Linux push build; manual runs are never cancelled.
concurrency:
  group: build-linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: linux-x64
      runner: ubuntu-24.04
      configure: linux
      build: linux-release
      package: ${{ github.event_name == 'workflow_dispatch' }}
