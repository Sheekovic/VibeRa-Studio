# Draft release for a v* tag: builds and packages Windows, Linux and macOS (the same steps as
# the per-platform workflows, in build-platform.yml), then attaches every file and checksum to
# one draft prerelease. Nothing is published until a maintainer publishes the draft.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: windows-x64
      runner: windows-2022
      configure: windows
      build: release
      package: true
      release-tag: ${{ github.ref_name }}

  linux:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: linux-x64
      runner: ubuntu-24.04
      configure: linux
      build: linux-release
      package: true
      release-tag: ${{ github.ref_name }}

  macos:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: macos-universal
      runner: macos-15
      configure: macos
      build: macos-release
      package: true
      release-tag: ${{ github.ref_name }}

  release:
    name: Assemble draft release
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: release-assets
          merge-multiple: true

      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: VibeRa Studio ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Native build candidates for Windows x64, Linux x64, and macOS (Apple Silicon and Intel).
            Compilation and packaging do not establish audio, recording, plugin, or native UI acceptance.
            macOS candidates are ad-hoc signed, not Developer ID signed or notarized.
            Linux candidates target Ubuntu 24.04 and compatible systems; system audio/GUI libraries are required.
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*-Setup.exe
            release-assets/*.sha256
            release-assets/candidate-*.json
